[project]
name = "avwap-platform"
version = "0.1.0"
description = "AVWAP F&O options research and trading platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "PyYAML>=6",
  "pandas>=2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "typer>=0.12",
  "structlog>=24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
